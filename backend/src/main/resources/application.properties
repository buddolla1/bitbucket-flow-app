server.port=${SERVER_PORT:8081}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/bitbucket_flow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.sql.init.continue-on-error=true

bitbucket.base-url=${BITBUCKET_BASE_URL:}
bitbucket.username=${BITBUCKET_USERNAME:}
bitbucket.api-token=${BITBUCKET_API_TOKEN:}
bitbucket.user-lookup-path=${BITBUCKET_USER_LOOKUP_PATH:/rest/api/1.0/users?filter=}
bitbucket.page-size=${BITBUCKET_PAGE_SIZE:100}
bitbucket.catalog-ttl-hours=${BITBUCKET_CATALOG_TTL_HOURS:24}
bitbucket.sync-concurrency=${BITBUCKET_SYNC_CONCURRENCY:5}
bitbucket.full-scan-days=${BITBUCKET_FULL_SCAN_DAYS:7}
bitbucket.participant-batch-size=${BITBUCKET_PARTICIPANT_BATCH_SIZE:25}
bitbucket.user-lookup-ttl-hours=${BITBUCKET_USER_LOOKUP_TTL_HOURS:168}

